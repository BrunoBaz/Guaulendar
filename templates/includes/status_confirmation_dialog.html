<dialog class="contact-dialog status-confirmation-dialog" id="status-confirmation-dialog"
    aria-labelledby="status-confirmation-title" aria-describedby="status-confirmation-message">
    <p class="contacts-eyebrow">GUAULENDAR / CONFIRMACIÓN</p>
    <h2 id="status-confirmation-title">Confirmar cambio de estado</h2>
    <p class="contact-dialog__intro" id="status-confirmation-message"></p>
    <footer class="contact-dialog__actions">
        <button class="contact-dialog__button contact-dialog__button--secondary"
            type="button" data-cancel-status-confirmation>Cancelar</button>
        <button class="contact-dialog__button contact-dialog__button--primary"
            type="button" data-accept-status-confirmation>Confirmar</button>
    </footer>
</dialog>
