{% extends "base.html" %}
{% block content %}
<section class="auth-page" aria-labelledby="password-reset-done-title">
    <header class="auth-heading">
        <p class="auth-eyebrow">GUAULENDAR / RECUPERAR ACCESO</p>
        <h1 id="password-reset-done-title">Revisa <span>tu correo</span></h1>
    </header>

    <p class="auth-intro">
        Si ese email tiene una cuenta, te hemos enviado un enlace para elegir una contraseña nueva.
        El enlace caduca en poco tiempo; si no lo ves, mira en la carpeta de spam.
    </p>

    <p class="auth-alt">
        <a href="{% url 'login' %}">Volver al acceso</a>
    </p>
</section>
{% endblock %}
